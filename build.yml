name: Собрать APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Принять лицензии Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Сборка
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: otlipni-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Выложить в Releases (ссылка для скачивания на телефон)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk otlipni.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest otlipni.apk --title "Отлипни — свежая сборка" --notes "Сборка №${GITHUB_RUN_NUMBER}. Скачай otlipni.apk на телефон и установи."
