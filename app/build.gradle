plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.otlipni.app'
    compileSdk 34

    defaultConfig {
        applicationId "ru.otlipni.app"
        minSdk 28
        targetSdk 34
        // номер сборки растёт сам с каждым запуском на GitHub
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger())
        versionName "0.1." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    signingConfigs {
        test {
            storeFile file('otlipni-test.keystore')
            storePassword 'otlipni123'
            keyAlias 'otlipni'
            keyPassword 'otlipni123'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.test }
        release {
            minifyEnabled false
            signingConfig signingConfigs.test
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
