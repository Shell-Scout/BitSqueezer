<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Unglued / Отлипни</title>
<meta name="description" content="Питомец растёт, только пока ты не сидишь в телефоне. А ты сможешь отлипнуть?">
<meta name="theme-color" content="#0d1024">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta property="og:description" content="Питомец растёт, только пока ты не сидишь в телефоне. А ты сможешь отлипнуть?">
<style>
:root{--hue:260;--bg:#0c0f22;--card:#191d3d;--glass:linear-gradient(180deg,rgba(40,45,92,.72),rgba(25,29,61,.72));--line:rgba(255,255,255,.07);--card2:#21265099;--spring:cubic-bezier(.3,1.5,.5,1);--ease:cubic-bezier(.2,.8,.2,1);--ink:#f3f0ff;--mute:#9a97c4;--acc:#b8a4ff;--acc2:#ffb3d1;--good:#8ef0c0;--warn:#ffcf7a;--bad:#ff8a8a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:radial-gradient(120% 70% at 50% 0%,#1f2457 0%,var(--bg) 62%) fixed,var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Nunito","Varela Round",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden;-webkit-user-select:none;user-select:none}
#stars{position:fixed;left:0;top:0;width:2px;height:2px;border-radius:50%;pointer-events:none;z-index:0;opacity:.8}
.app{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 22px);display:flex;flex-direction:column;gap:14px;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.logo{font-weight:900;font-size:23px;letter-spacing:-.5px}
.logo span{color:var(--acc)}
.chips{display:flex;gap:6px}
.chip{background:var(--card);border:0;color:var(--ink);font:inherit;border-radius:999px;padding:7px 12px;font-weight:800;font-size:13px;white-space:nowrap}
button.chip{cursor:pointer;background:var(--acc);color:#1a1640}
.stage{display:flex;flex-direction:column;align-items:center;padding-top:4px}
.bubble{background:#fff;color:#1a1640;font-weight:750;font-size:15px;padding:10px 15px;border-radius:18px;max-width:320px;text-align:center;position:relative;line-height:1.28;min-height:42px;display:flex;align-items:center;justify-content:center;transition:opacity .25s}
.bubble:after{content:"";position:absolute;bottom:-8px;left:50%;margin-left:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
.tilt{transition:transform .25s ease-out;position:relative;touch-action:none}
.pet{width:230px;height:230px;margin-top:4px;cursor:pointer;animation:bob 2.6s ease-in-out infinite;transform-origin:50% 92%}
.pet.jump{animation:jump .5s ease-out}
.pet.wobble{animation:wobble .6s ease-in-out}
.pet.dizzy{animation:dizzy .5s linear infinite}
@keyframes bob{0%,100%{transform:scale(1,1)}50%{transform:scale(1.035,.965)}}
@keyframes jump{0%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-28px) scale(.95,1.06)}60%{transform:translateY(0) scale(1.08,.92)}100%{transform:translateY(0) scale(1,1)}}
@keyframes wobble{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
@keyframes dizzy{0%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}100%{transform:rotate(-6deg)}}
.pet svg,.mini svg,.av svg{width:100%;height:100%;overflow:visible;display:block}
.eyes{transform-box:fill-box;transform-origin:center;transition:transform .08s ease-in}
.blinking .eyes{transform:scaleY(.08)}
.look{transform:translate(var(--lx,0px),var(--ly,0px));transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.face{transform-box:fill-box;transform-origin:50% 60%}
.fx .face{animation:facepop .32s cubic-bezier(.3,1.6,.5,1)}
@keyframes facepop{0%{transform:scale(.82,1.12)}100%{transform:scale(1)}}
.mouth{transform-box:fill-box;transform-origin:50% 20%}
.talking .mouth{animation:talk .16s ease-in-out 6 alternate}
@keyframes talk{from{transform:scaleY(1)}to{transform:scaleY(.45) scaleX(1.1)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.whisk{transform-box:fill-box;transform-origin:100% 50%;animation:whisk 3.4s ease-in-out infinite}
.whisk.r{transform-origin:0 50%;animation-delay:.15s}
@keyframes whisk{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-7deg)}94%{transform:rotate(5deg)}}
.ear{transform-box:fill-box;transform-origin:50% 100%;animation:ear 5s ease-in-out infinite}
.ear.r{animation-delay:2.3s}
@keyframes ear{0%,88%,100%{transform:rotate(0)}92%{transform:rotate(-10deg)}96%{transform:rotate(4deg)}}
.wing{transform-box:fill-box;transform-origin:80% 30%;animation:wing 2.8s ease-in-out infinite}
.wing.r{transform-origin:20% 30%}
@keyframes wing{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-14deg)}90%{transform:rotate(6deg)}}
.flower{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.spr{position:relative;width:100%;height:100%}
.spr img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.heart{position:absolute;pointer-events:none;width:22px;height:22px;animation:heart 1.2s ease-out forwards;z-index:3}
@keyframes heart{0%{opacity:0;transform:translateY(0) scale(.5)}20%{opacity:1;transform:translateY(-10px) scale(1.1)}100%{opacity:0;transform:translateY(-90px) scale(.9)}}
.name{font-size:29px;font-weight:900;margin-top:2px;cursor:pointer;text-align:center;line-height:1.1}
.name small{display:block;font-size:14px;color:var(--mute);font-weight:750;margin-top:3px}
.roster{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.av{width:48px;height:48px;border-radius:16px;background:var(--card);padding:4px;cursor:pointer;border:2px solid transparent;transition:transform .15s}
.av.on{border-color:var(--acc);background:#262b55}
.av:active{transform:scale(.92)}
.card{background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:15px 17px;box-shadow:0 10px 30px -18px #000}
.bars{display:grid;gap:12px}
.bar label{display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:var(--mute);margin-bottom:6px;gap:8px}
.bar label b{color:var(--ink);text-align:right}
.track{height:12px;background:#0b0e20;border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;border-radius:99px;transition:width .7s,background .7s}
.big{appearance:none;border:0;border-radius:24px;padding:20px;font:inherit;font-size:20px;font-weight:900;color:#1a1640;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 12px 30px -10px #b8a4ffaa;cursor:pointer;transition:transform .1s}
.big{transition:transform .25s var(--spring),box-shadow .3s}
.big:active{transform:scale(.96)}
.status{background:linear-gradient(135deg,rgba(48,52,112,.8),rgba(56,40,96,.8));border:1px solid var(--line);border-radius:24px;padding:16px 18px;display:grid;gap:6px}
.status h3{font-size:17px;font-weight:900;line-height:1.25}
.status p{font-size:13.5px;color:#cfcbef;font-weight:650;line-height:1.4}
.status .btn{margin-top:6px}
.hint{text-align:center;color:var(--mute);font-size:13px;font-weight:650;margin-top:-6px;line-height:1.35}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:12px 6px;text-align:center}
.stat b{display:block;font-size:18px;font-weight:900}
.stat span{font-size:12px;color:var(--mute);font-weight:750}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn{appearance:none;border:1px solid var(--line);border-radius:18px;padding:14px 10px;font:inherit;font-weight:850;font-size:15px;background:var(--glass);color:var(--ink);cursor:pointer;text-align:center;transition:transform .25s var(--spring),background .2s,opacity .2s}
.btn:disabled{opacity:.45}
.row3 .btn{font-size:14px;padding:14px 6px}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,#c3b2ff,#a993ff);color:#1a1640;border-color:transparent;box-shadow:0 8px 20px -10px #b8a4ffaa}
.challenge{background:linear-gradient(135deg,#3b2c70,#61294f);border-radius:22px;padding:14px 16px;display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;position:relative}
.challenge .mini{width:64px;height:64px}
.challenge h3{font-size:16px;font-weight:900;margin-bottom:3px;padding-right:22px}
.challenge p{font-size:13px;font-weight:700;color:#e6defa;line-height:1.3}
.x{position:absolute;top:8px;right:10px;background:none;border:0;color:#fff;opacity:.6;font-size:20px;cursor:pointer;padding:4px;font-family:inherit}
.vs{grid-column:1/-1;display:grid;gap:6px;font-size:12px;font-weight:800}
.vs .track{height:9px}
.tip{background:var(--card2);border:1px dashed #4a4f8a;border-radius:18px;padding:12px 34px 12px 14px;font-size:13px;font-weight:700;color:#d8d4ff;line-height:1.4;position:relative}
footer{text-align:center;color:#6e6b9c;font-size:12px;font-weight:650;line-height:1.8;margin-top:auto;padding-top:6px}
footer a{color:#8a87bb;cursor:pointer;text-decoration:underline;margin:0 6px}
.overlay{position:fixed;inset:0;background:#000;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 26px;gap:14px}
.overlay.on{display:flex}
.overlay .pet{width:190px;height:190px;animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.05,.95)}}
.overlay.sleep .pet{opacity:.35}
.ov-title{font-size:23px;font-weight:900;line-height:1.2}
.ov-sub{font-size:15px;font-weight:650;color:var(--mute);line-height:1.4;max-width:300px}
.ov-timer{font-size:44px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:1px;color:#6c6aa0}
.overlay.sleep .ov-title,.overlay.sleep .ov-timer{color:#4c4a78}
.overlay.sleep .ov-sub{color:#3b3960}
.overlay.grace .ov-title{color:var(--warn)}
.zz{position:relative;width:190px;height:0}
.zz i{position:absolute;font-style:normal;font-weight:900;color:#3e3c6a;animation:z 3s linear infinite;opacity:0}
.zz i:nth-child(1){left:130px;top:-200px;font-size:22px}
.zz i:nth-child(2){left:150px;top:-215px;font-size:28px;animation-delay:1s}
.zz i:nth-child(3){left:170px;top:-232px;font-size:34px;animation-delay:2s}
@keyframes z{0%{opacity:0;transform:translate(0,10px)}30%{opacity:1}100%{opacity:0;transform:translate(14px,-30px)}}
.overlay:not(.sleep) .zz{display:none}
.wake{appearance:none;background:none;border:1.5px solid #2c2a50;color:#5d5a90;font:inherit;font-weight:800;font-size:14px;border-radius:99px;padding:10px 20px;cursor:pointer;margin-top:10px}
.warn{font-size:12px;color:var(--warn);font-weight:700;max-width:290px;opacity:.8}
.modal{position:fixed;inset:0;background:#05061299;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:20;display:none;align-items:flex-end;justify-content:center;padding:14px}
.modal.on{display:flex}
.sheet{background:var(--card);border-radius:28px;padding:22px 20px calc(env(safe-area-inset-bottom) + 18px);width:100%;max-width:420px;text-align:center;display:grid;gap:12px;animation:up .32s cubic-bezier(.2,.9,.3,1.2);max-height:92vh;overflow:auto}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-size:22px;font-weight:900;line-height:1.2}
.sheet p{font-size:15px;color:#cfcbef;font-weight:650;line-height:1.4}
.gain{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.gain span{background:#0d1024;border-radius:14px;padding:9px 13px;font-weight:900;font-size:15px}
.gain span.g{color:var(--good)}.gain span.b{color:var(--bad)}
.levelup{background:linear-gradient(135deg,#ffd25e33,#ff8fb133);border-radius:18px;padding:12px;font-weight:850}
.sheet .mini{width:110px;height:110px;margin:0 auto}
.sheet img.card-img{width:100%;border-radius:18px;display:block}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-height:52vh;overflow:auto}
.cell{background:#0d1024;border-radius:16px;padding:10px 4px 8px;font-size:30px;line-height:1;position:relative;border:2px solid transparent}
.cell small{display:block;font-size:10.5px;font-weight:750;color:var(--mute);margin-top:6px;line-height:1.15}
.cell img{width:40px;height:40px;object-fit:contain}
.cell.t1{border-color:#7ad0ff55}.cell.t2{border-color:#c49bff88}.cell.t3{border-color:#ffd25e}
.cell.lock{opacity:.35;filter:grayscale(1)}
.cell .q{font-size:22px;font-weight:900;color:var(--mute);height:30px;display:flex;align-items:center;justify-content:center}
.cell b{position:absolute;top:4px;right:6px;font-size:11px;color:var(--mute)}
.found{background:#0d1024;border-radius:18px;padding:12px;display:flex;align-items:center;gap:12px;text-align:left;font-weight:750;font-size:14px}
.found .ic{font-size:36px;line-height:1;min-width:44px;text-align:center}.found .ic img{width:48px;height:48px}
.tier{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.5px}
.hatch{width:140px;height:140px;margin:0 auto;position:relative}
.hatch>div{position:absolute;inset:0}
.hatch .egg{animation:hshake 1.4s ease-in-out forwards}
.hatch .born{opacity:0;transform:scale(.3);animation:pop .5s 1.35s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes hshake{0%{transform:rotate(0)}10%{transform:rotate(-8deg)}20%{transform:rotate(8deg)}30%{transform:rotate(-10deg)}40%{transform:rotate(10deg)}50%{transform:rotate(-12deg)}60%{transform:rotate(12deg)}75%{transform:rotate(-14deg) scale(1.05)}90%{transform:scale(1.15);opacity:1}100%{transform:scale(1.4);opacity:0}}
@keyframes pop{to{opacity:1;transform:scale(1)}}
.dream{font-size:14px;color:#cfcbef;font-weight:650;font-style:italic}
.plist{display:grid;gap:8px;text-align:left}
.prow{display:flex;align-items:center;gap:12px;background:#0d1024;border-radius:18px;padding:8px 12px;cursor:pointer;border:2px solid transparent}
.prow.on{border-color:var(--acc)}
.prow .av{background:none;border:0;padding:0;width:52px;height:52px}
.prow b{display:block;font-size:16px}.prow span{font-size:12.5px;color:var(--mute);font-weight:700}
input.field{font:inherit;font-size:20px;font-weight:800;text-align:center;padding:14px;border-radius:16px;border:1px solid #3a3f78;background:rgba(10,12,30,.7);color:#fff;width:100%;-webkit-user-select:text;user-select:text}
/* ---- плавность ---- */
.stage{position:relative}
.glow{position:absolute;left:50%;top:70px;width:300px;height:300px;margin-left:-150px;border-radius:50%;background:radial-gradient(circle,hsla(var(--hue),80%,70%,.28),hsla(var(--hue),80%,60%,0) 65%);filter:blur(8px);pointer-events:none;animation:glow 5s ease-in-out infinite;transition:background 1s}
@keyframes glow{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.12);opacity:1}}
.app>*{animation:rise .6s var(--ease) both}
.app>*:nth-child(2){animation-delay:.04s}.app>*:nth-child(3){animation-delay:.08s}.app>*:nth-child(4){animation-delay:.12s}.app>*:nth-child(5){animation-delay:.16s}.app>*:nth-child(6){animation-delay:.2s}.app>*:nth-child(7){animation-delay:.24s}.app>*:nth-child(8){animation-delay:.28s}.app>*:nth-child(9){animation-delay:.32s}.app>*:nth-child(10){animation-delay:.36s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.bubble.pop{animation:bpop .35s var(--spring)}
@keyframes bpop{from{transform:scale(.85)}to{transform:scale(1)}}
.pet.swap{animation:swap .5s var(--spring)}
@keyframes swap{0%{opacity:0;transform:scale(.6) translateY(20px)}100%{opacity:1;transform:none}}
.modal{transition:opacity .25s}.modal.out{opacity:0}
.modal.out .sheet{transform:translateY(40px);opacity:0;transition:transform .25s var(--ease),opacity .25s}
.sheet>*{animation:rise .45s var(--ease) both}.sheet>*:nth-child(2){animation-delay:.05s}.sheet>*:nth-child(3){animation-delay:.1s}.sheet>*:nth-child(4){animation-delay:.15s}.sheet>*:nth-child(5){animation-delay:.2s}.sheet>*:nth-child(6){animation-delay:.25s}.sheet>*:nth-child(n+7){animation-delay:.3s}
.fill{transition:width 1s var(--ease),background .7s}
.av{transition:transform .25s var(--spring),border-color .2s,background .2s}
.eggcard{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;background:linear-gradient(135deg,rgba(255,210,94,.16),rgba(255,143,177,.14));border:1px solid rgba(255,210,94,.35);border-radius:24px;padding:12px 14px}
.eggcard .mini{width:62px;height:62px;animation:wob 2.4s ease-in-out infinite}
.eggcard h3{font-size:15.5px;font-weight:900}.eggcard p{font-size:12.5px;color:#e6defa;font-weight:700}
.eggcard .btn{padding:12px 16px}
@keyframes wob{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-9deg)}82%{transform:rotate(8deg)}88%{transform:rotate(-5deg)}94%{transform:rotate(3deg)}}
.spark{animation:twinkle 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes twinkle{0%,100%{opacity:.4}50%{opacity:1}}
.spr.shiny{filter:drop-shadow(0 0 12px #ffd25e)}
.goldglow{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle,#ffd25e55,transparent 70%)}
/* ---- создание питомца ---- */
.onb{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px);background:radial-gradient(120% 70% at 50% 0%,#252a62 0%,var(--bg) 65%);opacity:0;transition:opacity .4s}
.onb.on{display:flex}.onb.show{opacity:1}.onb.out{opacity:0}
.onb-in{width:100%;max-width:420px;display:grid;gap:14px;text-align:center;animation:rise .55s var(--ease) both}
.onb-in.leave{animation:leave .25s var(--ease) both}
@keyframes leave{to{opacity:0;transform:translateY(-12px)}}
.onb h1{font-size:28px;font-weight:900;line-height:1.15;letter-spacing:-.3px}
.onb p{font-size:15px;color:#cfcbef;font-weight:650;line-height:1.45}
.onb .logo{font-size:30px}
.onb-egg{width:170px;height:170px;margin:0 auto}
.onb-egg.wob{animation:wob 2.4s ease-in-out infinite}
.reel{position:relative;height:138px;border-radius:26px;background:rgba(10,12,30,.6);border:1px solid var(--line);overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent)}
.strip{position:absolute;left:0;top:14px;display:flex;gap:12px;will-change:transform}
.tile{flex:none;width:92px;height:110px;border-radius:20px;background:#161a38;border:2px solid #2a2f5c;padding:8px 6px;transition:transform .4s var(--spring),box-shadow .4s}
.tile.r1{border-color:#7ad0ff66}.tile.r2{border-color:#c49bffaa}.tile.r3{border-color:#ffd25e;background:#2a2410}
.tile.win{transform:scale(1.12);box-shadow:0 0 0 3px currentColor,0 0 40px -4px currentColor}
.pointer{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:linear-gradient(#fff0,#fff,#fff0);opacity:.7}
.pointer:before,.pointer:after{content:"";position:absolute;left:50%;margin-left:-8px;border:8px solid transparent}
.pointer:before{top:0;border-top-color:#fff}.pointer:after{bottom:0;border-bottom-color:#fff}
.odds{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;font-size:11.5px;font-weight:800;opacity:.85}
.rollres{min-height:52px;display:grid;align-content:center;gap:2px}
.rollres b{font-size:22px;font-weight:900;animation:bpop .45s var(--spring)}
.rar{font-weight:900;text-transform:uppercase;letter-spacing:.6px;font-size:13px}
@media (prefers-reduced-motion: reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%) translateY(30px);background:#fff;color:#1a1640;font-weight:800;padding:12px 18px;border-radius:99px;z-index:30;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---- v6: настройки, пузырь, лицо поверх спрайта ---- */
.bubble{transition:opacity .25s,transform .5s var(--ease)}
.stage .tilt{z-index:1}.stage .bubble{z-index:2}
.spr svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--glass);color:var(--ink);width:38px;height:38px;border-radius:13px;display:grid;place-items:center;cursor:pointer;transition:transform .25s var(--spring)}
.iconbtn:active{transform:scale(.9) rotate(30deg)}
.iconbtn svg{width:20px;height:20px}
.set{display:grid;gap:8px;text-align:left}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(10,12,30,.55);border:1px solid var(--line);border-radius:18px;padding:13px 14px;min-height:56px}
.setrow.tap{cursor:pointer;transition:background .2s,transform .2s var(--spring)}
.setrow.tap:active{transform:scale(.98);background:rgba(40,45,92,.6)}
.setrow b{font-size:15px;font-weight:850;display:block}
.setrow small{display:block;font-size:12.5px;color:var(--mute);font-weight:700;margin-top:2px;line-height:1.3}
.setrow .chev{color:var(--mute);font-size:20px;font-weight:900}
.setrow.danger b{color:var(--bad)}
.sw{appearance:none;position:relative;width:52px;height:30px;border-radius:99px;background:#2b2f5e;border:0;cursor:pointer;flex:none;transition:background .25s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px #0006;transition:transform .3s var(--spring)}
.sw[aria-checked="true"]{background:var(--acc)}
.sw[aria-checked="true"]:after{transform:translateX(22px)}
.segm{display:flex;background:#0b0e20;border-radius:12px;padding:3px;gap:3px;flex:none}
.segm button{appearance:none;border:0;background:none;color:var(--mute);font:inherit;font-weight:850;font-size:13px;padding:7px 11px;border-radius:9px;cursor:pointer;transition:background .2s,color .2s}
.segm button[aria-pressed="true"]{background:var(--acc);color:#1a1640}
.pill{font-size:12px;font-weight:900;padding:5px 9px;border-radius:99px;background:#2b2f5e;color:var(--mute);flex:none}
.pill.on{background:rgba(142,240,192,.18);color:var(--good)}
.status .row2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px;background:rgba(255,207,122,.1);border:1px solid rgba(255,207,122,.3);border-radius:14px;padding:9px 10px}
.status .row2 span{font-size:12.5px;font-weight:750;color:var(--warn);line-height:1.3}
.status .row2 .btn{padding:8px 12px;font-size:13px;margin:0;flex:none}
.permlist{display:grid;gap:8px;text-align:left}
.permlist div{display:flex;gap:10px;align-items:flex-start;background:rgba(10,12,30,.5);border:1px solid var(--line);border-radius:16px;padding:11px 12px;font-size:14px;font-weight:700;color:#d8d4ff;line-height:1.35}
.permlist i{font-style:normal;flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-weight:900;font-size:13px;background:#2b2f5e;color:var(--acc)}
.linkbtn{appearance:none;background:none;border:0;color:var(--mute);font:inherit;font-weight:800;font-size:14px;cursor:pointer;padding:8px;text-decoration:underline}
</style>
</head>

(function(){
'use strict';
const $=s=>document.querySelector(s);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const pad=n=>String(n).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

const T=()=>L10N[S&&S.lang==='en'?'en':(S&&S.lang==='ru'?'ru':LANG0)];

 ['ticket','🎫',1],['juice','🧃',1],['shades','🕶️',1],['tape','📼',1],['seeds','🌻',1],['bear','🧸',1],
 ['ufo','🛸',2],['guitar','🎸',2],['gem','💎',2],['duck','🦆',2],['crown','👑',3],['moon','🌙',3],['dragon','🐉',3],['tama','📟',3]];

function mkPet(id,rarity,name){const shiny=rarity===3;return{id,name:name||randName(),hue:shiny?45:Math.floor(Math.random()*360),species:pick(POOL[rarity]),rarity,shiny,born:Date.now(),total:0}}
function blank(){const now=Date.now();return{v:2,lang:null,nextId:0,pets:[],active:0,hunger:80,hungerAt:now,zeroAt:0,allTotal:0,best:0,days:{},items:{},itemDays:{},history:[],rival:null,tips:{},session:null,lastScan:now,eggsGot:0,eggsPending:0,sound:true,vibe:true}}
function load(){

  try{const o=JSON.parse(localStorage.getItem(OLD));if(o&&o.v===1){const s=blank();

    Object.keys(o.days||{}).forEach(k=>s.days[k]={l:o.days[k],u:0});return s}}catch(e){}

}
S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

function fmt(sec){const u=T().u;sec=Math.floor(sec);if(sec<60)return sec+u.s;const m=Math.floor(sec/60);if(m<60)return m+u.m;const h=Math.floor(m/60);return h+u.h+' '+pad(m%60)+u.m}
function clock(sec){sec=Math.floor(sec);const h=Math.floor(sec/3600),m=Math.floor(sec/60)%60,s=sec%60;return(h?h+':'+pad(m):m)+':'+pad(s)}
const hhmm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};

function decayTo(t){if(t<=S.hungerAt)return;const h=hungerNow(t);if(S.hunger>0&&h<=0)S.zeroAt=S.hungerAt+S.hunger/MODE.rate*1000;S.hunger=h;S.hungerAt=t}

function zeroTime(){if(S.zeroAt&&S.hunger<=0)return S.zeroAt;if(hungerNow()<=0)return S.hunger>0?S.hungerAt+S.hunger/MODE.rate*1000:(S.zeroAt||S.hungerAt);return 0}
function isGone(){const z=zeroTime();return z&&Date.now()-z>GONE_AFTER}
const stageOf=t=>{let i=0;MODE.stages.forEach((s,k)=>{if(t>=s)i=k});return i};
function crackOf(t){return t>=MODE.stages[1]?3:Math.min(3,Math.floor(t/MODE.stages[1]*4))}
function moodOf(p){if(stageOf(p.total)===0)return'egg';const h=hungerNow();return h<=0?'sick':h<30?'sad':h<60?'ok':'happy'}
const eggAt=k=>(k<MODE.eggs.length?MODE.eggs[k]:MODE.eggs[MODE.eggs.length-1]+MODE.eggStep*(k-MODE.eggs.length+1))*3600;
function day(k){return S.days[k]||(S.days[k]={l:0,u:0})}
function addSpan(field,a,b){while(a<b){const d=new Date(a);const next=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime();const e=Math.min(b,next);day(dk(d))[field]+=(e-a)/1000;a=e}
  const keys=Object.keys(S.days).sort();while(keys.length>120)delete S.days[keys.shift()]}
function streak(){
  const d=new Date();let n=0;
  if(NATIVE){const today=S.days[dk(d)];if(today&&today.u>MODE.screenGoal)return 0;while(S.days[dk(d)]&&S.days[dk(d)].u<=MODE.screenGoal){n++;d.setDate(d.getDate()-1)}return n}
  if(((S.days[dk(d)]||{}).l||0)<MODE.dayGoal)d.setDate(d.getDate()-1);
  while(((S.days[dk(d)]||{}).l||0)>=MODE.dayGoal){n++;d.setDate(d.getDate()-1)}return n;
}

/* ---------- сон: все питомцы спят вместе ---------- */
function addSleep(sec,end){
  const ups=[];
  S.pets.forEach(p=>{const b=stageOf(p.total);p.total+=sec;const a=stageOf(p.total);if(a>b)ups.push({p,before:b,after:a})});
  S.allTotal+=sec;S.best=Math.max(S.best,sec);
  let eggs=checkEggs();
  let item=null;
  if(sec>=MODE.itemMin){const k=dk(new Date(end));S.itemDays=S.itemDays||{};if((S.itemDays[k]||0)<MODE.itemsPerDay){S.itemDays[k]=(S.itemDays[k]||0)+1;item=rollItem(sec)}
    const ks=Object.keys(S.itemDays).sort();while(ks.length>10)delete S.itemDays[ks.shift()]}
  return{ups,eggs,item};
}
const eggProg=()=>S.allTotal+(S.eggBonus||0);
function checkEggs(){let n=0;while(eggProg()>=eggAt(S.eggsGot)){S.eggsGot++;S.eggsPending=(S.eggsPending||0)+1;n++}return n}
function addPet(rarity,name){const p=mkPet(++S.nextId,rarity,name);S.pets.push(p);S.active=S.pets.length-1;return p}
function rollItem(sec){
  const Tt=MODE.tiers;let tier=0;
  if(sec>=Tt[2]&&Math.random()<.25)tier=3;else if(sec>=Tt[1]&&Math.random()<.25)tier=2;else if(sec>=Tt[0]&&Math.random()<.35)tier=1;
  const pool=ITEMS.filter(i=>i[2]===tier),fresh=pool.filter(i=>!S.items[i[0]]);
  const it=(fresh.length&&Math.random()<.7)?pick(fresh):pick(pool);
  S.items[it[0]]=(S.items[it[0]]||0)+1;return it;
}

/* ---------- реплики ---------- */
let lastLine='',lastAway=0;
function others(){const p=P();return S.pets.filter(x=>x!==p&&stageOf(x.total)>0)}
function call(x,...a){return typeof x==='function'?x(...a):x}
function lineFor(){
  const L=T().L,p=P(),m=moodOf(p),h=new Date().getHours(),r=Math.random(),today=S.days[dk(new Date())];
  if(m==='egg'||m==='sick')return pick(L[m]);
  if(NATIVE&&today&&r<.2){if(today.u>3*3600)return call(pick(L.heavy),fmt(today.u));if(h>=18&&today.u<1.5*3600)return call(pick(L.light),fmt(today.u))}
  if(r<.32){if(h>=23||h<5)return pick(L.night);if(h<10)return pick(L.morning);if(h>=19)return pick(L.evening)}
  if(r<.42&&others().length)return call(pick(L.others),pick(others()).name);
  if(r<.47&&Object.keys(S.items).length)return pick(L.items);
  return pick(L[m]);
}
function say(t){const b=$('#bubble');b.classList.remove('pop');b.style.opacity=0;setTimeout(()=>{b.textContent=t;b.style.opacity=1;void b.offsetWidth;b.classList.add('pop');talk()},180)}

/* ---------- звуки (mp3 из sounds/, иначе синтезированная заглушка) ---------- */
const SOUNDS={tap:[660,.06,'square'],pet:[440,.12,'sine',550],angry:[180,.25,'sawtooth',120],dizzy:[500,.4,'triangle',250],talk:[520,.05,'square',600],
  hatch:[400,.5,'triangle',900],grow:[523,.35,'sine',1046],item0:[700,.12,'sine',900],item1:[700,.18,'triangle',1100],item2:[600,.3,'triangle',1300],item3:[500,.5,'sine',1500],
  newegg:[350,.4,'triangle',700],welcome:[440,.25,'sine',660],gone:[400,.6,'sine',150],click:[900,.03,'square'],tick:[1200,.025,'square'],spin:[300,.5,'sine',700],
  sleep:[500,.4,'sine',250],wake:[300,.3,'sine',600]};
/* Звуки через Web Audio: файлы декодируются один раз, каждый щелчок — отдельный источник,
   поэтому быстрые повторы (рулетка) не теряются, как бывало с одним <audio>. */
const RAW={},BUF={};let actx=null;
function ac(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}return actx}
Object.keys(SOUNDS).forEach(n=>{try{const x=new XMLHttpRequest();x.open('GET','sounds/'+n+'.mp3');x.responseType='arraybuffer';
  x.onload=()=>{if((x.status===200||x.status===0)&&x.response&&x.response.byteLength>200)RAW[n]=x.response};x.onerror=()=>{};x.send()}catch(e){}});
function decode(n){if(BUF[n]||!RAW[n]||!ac())return Promise.resolve(BUF[n]);const r=RAW[n];RAW[n]=null;
  return new Promise(res=>{try{actx.decodeAudioData(r.slice(0),b=>{BUF[n]=b;res(b)},()=>res(null))}catch(e){res(null)}})}
function decodeAll(){Object.keys(SOUNDS).forEach(decode)}
// звук в WebView разрешён только после касания — «будим» его на первом тапе и сразу готовим все файлы
['pointerdown','touchstart','keydown'].forEach(ev=>document.addEventListener(ev,()=>{ac();decodeAll()},{once:true,passive:true}));
function playBuf(b){const c=ac();if(!c)return;const src=c.createBufferSource();src.buffer=b;src.connect(c.destination);src.start()}
function beep(n){const d=SOUNDS[n];const c=ac();if(!d||!c)return;try{
  const o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type=d[2];o.frequency.setValueAtTime(d[0],t);if(d[3])o.frequency.exponentialRampToValueAtTime(d[3],t+d[1]);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+d[1]);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d[1]+.02)}catch(e){}}
function play(n){if(n==='switch')n='welcome';if(!S.sound)return;
  if(BUF[n])return playBuf(BUF[n]);
  if(RAW[n]){decode(n).then(b=>b?playBuf(b):beep(n));return}
  beep(n)}
function vibrate(ms){if(!S.vibe)return;if(NATIVE){nat('vibrate',Array.isArray(ms)?ms.reduce((a,b)=>a+b,0):ms);return}try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

/* ---------- спрайты: PNG из sprites/, иначе рисуем сами ---------- */
const SPR={};
const SCALE=[1,.62,.78,.9,1,1.04];
const FACES=['happy','ok','sad','sick','sleep','love','angry','dizzy','surprised','egg'];
const RARN=['common','rare','epic','legend'];
function loadSprites(){
  const names=[];
  for(let c=0;c<4;c++){names.push('egg_'+c);RARN.forEach(r=>names.push('egg_'+r+'_'+c))}
  for(let st=1;st<=5;st++)names.push('body_'+st);
  SPECIES.forEach(sp=>{for(let st=1;st<=5;st++)names.push(sp+'_body_'+st);FACES.forEach(f=>names.push(sp+'_face_'+f))});
  FACES.forEach(f=>names.push('face_'+f));
  ITEMS.forEach(i=>names.push('item_'+i[0]));
  let left=names.length;const done=()=>{if(--left===0)render()};
  names.forEach(n=>{const i=new Image();i.onload=()=>{SPR[n]=i.src;done()};i.onerror=done;i.src='sprites/'+n+'.png'});
}
function bodySpr(sp,st){return SPR[sp+'_body_'+st]||(sp==='blob'?SPR['body_'+st]:null)}
function petHTML(o){
  const eggSrc=SPR['egg_'+RARN[o.rarity||0]+'_'+(o.crack||0)]||SPR['egg_'+(o.crack||0)];
  if(o.stage===0&&eggSrc){const f=(o.face&&SPR.face_egg)?`<img src="${SPR.face_egg}">`:'';return `<div class="spr">${o.rarity===3?'<div class="goldglow"></div>':''}<img src="${eggSrc}">${f}</div>`}
  const b=o.stage>0&&bodySpr(o.species||'blob',o.stage);
  if(b){
    const sp=o.species||'blob',fk=o.sleep?'sleep':(o.face||o.mood);
    const face=SPR[sp+'_face_'+fk]||SPR['face_'+fk]||SPR[sp+'_face_happy']||SPR.face_happy;
    // своего лица в PNG нет — рисуем лицо кодом поверх тела, в той же зоне
    const faceLayer=face?`<img src="${face}">`:wrapSVG(faceMarkup(o));
    return `<div class="spr${o.shiny?' shiny':''}" style="transform:scale(${SCALE[o.stage]});transform-origin:50% 92%"><img src="${b}">${faceLayer}</div>`;
  }

}
function petOpts(p,extra){return Object.assign({stage:stageOf(p.total),mood:moodOf(p),hue:p.hue,species:p.species,rarity:p.rarity||0,shiny:!!p.shiny,sleep:false,crack:crackOf(p.total),face:null},extra||{})}

/* ---------- приложение: разбор блокировок ---------- */
function scan(){
  if(!NATIVE||!S.pets.length)return;
  const now=Date.now(),since=Math.max(S.lastScan||0,now-7*864e5);
  let list=[];try{list=JSON.parse((nat('hasUsageAccess')?nat('scanLocked',since):nat('takeIntervals',since))||'[]')}catch(e){list=[]}
  return processList(list,since,now);
}
function processList(list,since,now){
  list.sort((a,b)=>a[0]-b[0]);
  const hStart=Math.round(Math.min(100,hungerNow(since)));
  const ag={sec:0,n:0,longest:0,ups:[],eggs:0,items:[],screen:0};
  let cur=since;if(S.hungerAt<since)decayTo(since);
  for(const [a0,b] of list){
    const a=Math.max(a0,cur);if(b<=a)continue;
    addSpan('u',cur,a);ag.screen+=(a-cur)/1000;decayTo(a);
    const raw=(b-a)/1000;
    if(raw>=60){const c=Math.min(raw,MODE.cap);feed(c,b);addSpan('l',a,a+c*1000);const r=addSleep(c,b);
      ag.sec+=c;ag.n++;ag.longest=Math.max(ag.longest,c);ag.ups.push(...r.ups);ag.eggs+=r.eggs;if(r.item)ag.items.push(r.item);S.lastSleep={s:a,e:b,sec:c}}
    else S.hungerAt=b;
    cur=b;
  }
  if(now>cur){addSpan('u',cur,now);ag.screen+=(now-cur)/1000}
  decayTo(now);S.lastScan=now;save();
  return{ag,hStart,hEnd:Math.round(hungerNow())};
}
function upsHTML(ups){const t=T();return ups.map(u=>{const p=u.p,n=esc(p.name);
  if(u.before===0)return `<div class="levelup">${t.hatched(n,SPN(p.species),p.shiny,t.rarSpecies[p.rarity||0])}</div><div class="hatch"><div class="egg">${petHTML({stage:0,crack:3,hue:p.hue,mood:'egg',species:p.species,rarity:p.rarity})}</div><div class="born">${petHTML(petOpts(p))}</div></div>`;
  return `<div class="levelup">${t.grew(n,STAGE(u.after))}</div>`}).join('')}
function eggsHTML(n){return n?`<div class="levelup">${T().eggsGot(n)}</div><div class="mini">${MYSTERY}</div>`:''}
const itemIcon=it=>SPR['item_'+it[0]]?`<img src="${SPR['item_'+it[0]]}">`:it[1];
function itemHTML(it){const t=T();return `<div class="found"><div class="ic">${itemIcon(it)}</div><div>${t.foundIn}<br><b>${itemName(it)}</b><div class="tier" style="color:${TCOL[it[2]]}">${t.tiers[it[2]]} ${t.findWord}</div></div></div>`}
function showWelcome(res){
  if(!res)return false;const {ag}=res,t=T();if(ag.sec<60&&!ag.eggs)return false;

/* ---------- сайт: ручной сон экраном вниз ---------- */
let sess=null,wakeLock=null;
async function requestWake(){try{if('wakeLock' in navigator){wakeLock=await navigator.wakeLock.request('screen');return true}}catch(e){}return false}
function releaseWake(){try{wakeLock&&wakeLock.release()}catch(e){}wakeLock=null}
function startSession(){
  if(sess)return;const now=Date.now();
  sess={state:'wait',mode:null,counted:0,lastTick:now,lastSave:now,graceUntil:0,cdUntil:0,fd:false,got:false};
  S.session={start:now,counted:0,last:now};save();$('#overlay').classList.add('on');
  requestWake().then(ok=>{if(!ok&&sess){const w=$('#ovWarn');w.hidden=false;w.textContent=T().wakeWarn}});
  const begin=()=>{window.addEventListener('deviceorientation',onOrient);setTimeout(()=>{if(sess&&!sess.got){sess.mode='still';sess.state='countdown';sess.cdUntil=Date.now()+3000}},2500)};
  const DOE=window.DeviceOrientationEvent;if(DOE&&typeof DOE.requestPermission==='function'){DOE.requestPermission().then(begin,begin)}else begin();
  sess.timer=setInterval(tick,250);drawOverlay(true);
}
function onOrient(e){if(!sess||e.beta==null)return;sess.got=true;if(!sess.mode)sess.mode='flip';sess.fd=Math.abs(e.beta)>140&&Math.abs(e.gamma||0)<40}
let touchArmed=null;
function armTouch(){let x0=null,y0=null;const end=()=>finish('touch');const mm=e=>{if(x0===null){x0=e.clientX;y0=e.clientY;return}if(Math.hypot(e.clientX-x0,e.clientY-y0)>40)end()};touchArmed={end,mm};['pointerdown','keydown','wheel','touchstart'].forEach(t=>window.addEventListener(t,end,{passive:true}));window.addEventListener('mousemove',mm,{passive:true})}
function disarmTouch(){if(!touchArmed)return;['pointerdown','keydown','wheel','touchstart'].forEach(t=>window.removeEventListener(t,touchArmed.end));window.removeEventListener('mousemove',touchArmed.mm);touchArmed=null}
function tick(){
  if(!sess)return;const now=Date.now(),dt=Math.min((now-sess.lastTick)/1000,5);sess.lastTick=now;
  if(sess.state==='sleep')sess.counted+=dt;
  if(sess.mode==='flip'){
    if(sess.fd){if(sess.state!=='sleep'){sess.state='sleep';play('sleep');drawOverlay(true)}}
    else if(sess.state==='sleep'){sess.state='grace';sess.graceUntil=now+3000;vibrate([80,60,80]);drawOverlay(true)}
    else if(sess.state==='grace'&&now>sess.graceUntil){finish('lifted');return}
  }else if(sess.mode==='still'&&sess.state==='countdown'&&now>=sess.cdUntil){sess.state='sleep';armTouch();drawOverlay(true)}
  if(now-sess.lastSave>2000){sess.lastSave=now;S.session.counted=sess.counted;S.session.last=now;save()}
  drawOverlay(false);
}
let ovKey='';
function drawOverlay(force){
  if(!sess)return;const ov=$('#overlay'),st=sess.state,n=P().name,key=st+'|'+sess.mode,t=T();
  if(force||key!==ovKey){ovKey=key;
    ov.classList.toggle('sleep',st==='sleep');ov.classList.toggle('grace',st==='grace');
    $('#ovPet').innerHTML=curPet({sleep:st==='sleep'||(sess.mode==='still'&&st==='countdown')});
    let a,b;
    if(st==='wait'){a=t.ovWait[0];b=t.ovWait[1](n)}else if(st==='countdown'){a=t.ovCount[0];b=t.ovCount[1](n)}
    else if(st==='grace'){a=t.ovGrace[0](n);b=t.ovGrace[1]}else{a=t.ovSleep[0](n);b=sess.mode==='still'?t.ovSleep[1]:t.ovSleep[2]}
    $('#ovTitle').textContent=a;$('#ovSub').textContent=b;$('#wakeBtn').hidden=(sess.mode==='still'&&st==='sleep');
  }
  $('#ovTimer').textContent=st==='countdown'?String(Math.max(1,Math.ceil((sess.cdUntil-Date.now())/1000))):st==='grace'?String(Math.max(0,Math.ceil((sess.graceUntil-Date.now())/1000))):clock(sess.counted);
}
function finish(reason){
  if(!sess)return;const now=Date.now();
  if(sess.state==='sleep')sess.counted+=Math.min((now-sess.lastTick)/1000,5);
  clearInterval(sess.timer);window.removeEventListener('deviceorientation',onOrient);disarmTouch();releaseWake();
  const sec=Math.floor(sess.counted);sess=null;ovKey='';S.session=null;
  let r=null;if(sec>0){decayTo(now);feed(sec,now);addSpan('l',now-sec*1000,now);r=addSleep(sec,now)}save();
  $('#overlay').classList.remove('on','sleep','grace');$('#ovWarn').hidden=true;render();showResult(reason,sec,r);
}
function showResult(reason,sec,r){
  const t=T(),n=esc(P().name),why=(t.why[reason]||(()=>''))(n);
  let title,face='happy';
  if(sec<5){title=t.notAsleep;face='angry'}else if(sec<60){title=t.secs(sec);face='surprised'}else{title=t.offPhone(fmt(sec));face='love'}
  let html=`<div class="mini">${curPet({face})}</div><h2>${title}</h2><p>${why}</p>`;
  if(r)html+=`<div class="gain"><span class="g">+${fmt(sec)}</span><span class="g">${t.gFood(Math.round(sec*MODE.gain))}</span></div>`+upsHTML(r.ups)+eggsHTML(r.eggs)+(r.item?itemHTML(r.item):(sec>=60?`<p style="font-size:13px">${t.itemHintW(fmt(MODE.itemMin))}</p>`:''));
  if(sec>=60)html+=`<div class="dream">${t.dream(false,pick(t.dreams))}</div>`;
  html+=`<div class="row"><button class="btn" data-a="close">${t.ok}</button><button class="btn pri" data-a="again">${t.again}</button></div>`;

const TILE=92,STEP=104,WIN=42;
function openOnb(step){const o=$('#onb');onbFirst=!S.pets.length;o.classList.remove('out');o.classList.add('on');requestAnimationFrame(()=>o.classList.add('show'));showStep(step)}
function closeOnb(){const o=$('#onb');o.classList.add('out');onbStep='';setTimeout(()=>{o.classList.remove('on','show','out');o.innerHTML=''},420)}
function eggSVG(r){return petSVG({stage:0,rarity:r,crack:0,mood:'egg',sleep:true})}
function showStep(step){
  const o=$('#onb'),old=o.querySelector('.onb-in'),t=T();onbStep=step;
  const put=()=>{
    if(step==='intro')o.innerHTML=`<div class="onb-in"><div class="logo">${t.brand[0]}<span>${t.brand[1]}</span></div><div class="onb-egg wob">${MYSTERY}</div><h1>${t.onbTitle}</h1><p>${t.onbText}</p>
      <button class="big" data-o="roll">${t.onbGet}</button><div class="segm" style="margin:0 auto"><button data-o="lang" data-v="ru" aria-pressed="${lang()==='ru'}">Русский</button><button data-o="lang" data-v="en" aria-pressed="${lang()==='en'}">English</button></div></div>`;
    else if(step==='roll'){o.innerHTML=`<div class="onb-in"><h1>${onbFirst?t.rollFirst:t.rollNext}</h1><p>${t.rollText}</p>
      <div class="reel" id="reel"><div class="strip" id="strip"></div><div class="pointer"></div></div>
      <div class="odds">${t.rarity.map((r,i)=>`<span style="color:${TCOL[i]}">${r} ${RW[i]}%</span>`).join('')}</div>
      <div class="rollres" id="rollRes"></div><button class="big" id="rollBtn" data-o="spin">${t.spin}</button></div>`;buildStrip(null,2)}
    else if(step==='name')o.innerHTML=`<div class="onb-in"><div class="onb-egg wob">${eggSVG(onbRarity)}</div><h1>${t.nameTitle}</h1><div class="rar" style="color:${TCOL[onbRarity]}">${t.eggOf(onbRarity)}</div>
      <input class="field" id="onbName" maxlength="16" value="${esc(randName())}"><div class="row"><button class="btn" data-o="dice">${t.otherName}</button><button class="btn pri" data-o="done">${t.done}</button></div></div>`;
    else if(step==='perm')o.innerHTML=`<div class="onb-in"><div class="onb-egg wob" style="width:130px;height:130px">${eggSVG(onbRarity)}</div><h1>${t.permTitle}</h1><p>${t.permLead}</p>
      <div class="permlist">${t.permPoints.map((x,i)=>`<div><i>${i+1}</i><span>${x}</span></div>`).join('')}</div>
      <p style="font-size:13px">${t.permWhy}</p><button class="big" data-o="permyes">${t.permYes}</button><button class="linkbtn" data-o="permno">${t.permNo}</button></div>`;
  };
  if(old){old.classList.add('leave');setTimeout(put,230)}else put();
}
function center(i){return $('#reel').clientWidth/2-(i*STEP+TILE/2)}
function buildStrip(win,pos){
  const st=$('#strip'),tiles=[];for(let i=0;i<50;i++)tiles.push(i===WIN&&win!=null?win:rollRarity());
  st.innerHTML=tiles.map(r=>`<div class="tile r${r}" style="color:${TCOL[r]}">${eggSVG(r)}</div>`).join('');
  st.style.transition='none';st.style.transform=`translateX(${center(pos)}px)`;
}
function spin(){
  if(spinning)return;spinning=true;const t=T(),btn=$('#rollBtn');btn.disabled=true;btn.textContent=t.spinning;
  onbRarity=rollRarity();buildStrip(onbRarity,2);const st=$('#strip');void st.offsetWidth;
  st.style.transition='transform 5.2s cubic-bezier(.08,.62,.1,1)';st.style.transform=`translateX(${center(WIN)+(Math.random()-.5)*TILE*.6}px)`;
  play('spin');let last=-1;const w=$('#reel').clientWidth;
  const loop=()=>{if(!spinning)return;const x=new DOMMatrix(getComputedStyle(st).transform).m41;const idx=Math.floor((w/2-x)/STEP);if(idx!==last){last=idx;play('tick');vibrate(3)}requestAnimationFrame(loop)};requestAnimationFrame(loop);
  st.addEventListener('transitionend',()=>{
    spinning=false;st.children[WIN].classList.add('win');const r=onbRarity;
    $('#rollRes').innerHTML=`<b style="color:${TCOL[r]}">${t.eggOf(r)}!</b><span style="font-size:13px;color:var(--mute);font-weight:700">${t.rollFlavor[r]}</span>`;
    play('item'+r);vibrate(r>=2?[60,60,60,60,200]:[40]);btn.disabled=false;btn.textContent=t.next;btn.dataset.o='name';
  },{once:true});
}
function finishOnb(){
  const first=!S.pets.length,p=pendingPet;pendingPet=null;
  S.pets.push(p);S.active=S.pets.length-1;S.eggsPending=Math.max(0,(S.eggsPending||0)-1);
  if(first){S.lastScan=Date.now();S.hunger=80;S.hungerAt=Date.now();S.zeroAt=0}
  save();closeOnb();render();
  if(NATIVE){nat('startWatch');nat('requestNotifications')}
  setTimeout(()=>{say(first?T().helloFirst(p.name):T().helloMore(p.name));play('newegg')},450);
}
let pendingPet=null;
$('#onb').addEventListener('click',e=>{
  const a=e.target.closest('[data-o]');if(!a)return;const o=a.dataset.o;
  if(o==='spin'){spin();return}
  play('click');
  if(o==='lang'){S.lang=a.dataset.v;save();staticTexts();showStep('intro')}
  else if(o==='roll')showStep('roll');
  else if(o==='name')showStep('name');
  else if(o==='dice')$('#onbName').value=randName();
  else if(o==='done'){
    const name=($('#onbName').value.trim()||randName()).slice(0,16);
    pendingPet=mkPet(++S.nextId,onbRarity,name);
    // первый запуск в приложении: сразу предлагаем разрешение, чтобы сны считались сами
    if(NATIVE&&!S.pets.length&&!nat('hasUsageAccess'))showStep('perm');else finishOnb();
  }
  else if(o==='permyes'){nat('openUsageAccess')}
  else if(o==='permno'){finishOnb();setTimeout(()=>toast(T().permSkipNote.split('.')[0]+'.'),900)}
});

/* ---------- жизненный цикл ---------- */
function onReturn(){
  if(onbStep==='perm'){if(nat('hasUsageAccess')){finishOnb();setTimeout(()=>toast(T().permOk),700)}return}
  if(sess||!S.pets.length||$('#onb').classList.contains('on'))return;
  const res=scan();render();
  if(!checkGone()){if(showWelcome(res))say(call(pick(T().L.back),fmt(lastAway)));else chatter()}
  stareStart=Date.now();stared=false;
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(sess)finish('left');else save()}else if(!NATIVE)onReturn()});
window.addEventListener('pagehide',()=>{if(sess)finish('left')});
window.onNativeResume=()=>onReturn();
window.addEventListener('hashchange',()=>{readHash();render()});
(function(){let sh=[];for(let i=0;i<70;i++){const x=Math.random()*100,y=Math.random()*100,a=(.25+Math.random()*.6).toFixed(2);sh.push(`${x.toFixed(1)}vw ${y.toFixed(1)}vh 0 ${Math.random()<.15?1:0}px rgba(255,255,255,${a})`)}$('#stars').style.boxShadow=sh.join(',')})();

let stareStart=Date.now(),stared=false;
loadSprites();readHash();staticTexts();
if(NATIVE){$('.row3').after($('#action'))} // в приложении инфо-карточка ниже кнопок — при входе сразу видно главное
if(S.session&&!NATIVE&&S.pets.length){const sec=Math.floor(S.session.counted||0),end=S.session.last||Date.now();S.session=null;let r=null;if(sec>0){decayTo(end);feed(sec,end);r=addSleep(sec,end)}save();render();if(sec>0)showResult('recovered',sec,r)}
else S.session=null;
if(!S.pets.length){openOnb('intro')}
else{
  if(NATIVE)nat('startWatch');
  const first=scan();render();
  if(checkGone()){}else if(showWelcome(first)){say(call(pick(T().L.back),fmt(lastAway)))}else{chatter();const h=new Date().getHours();if(h>=23||h<5)setTimeout(()=>{if(!sess)say(pick(T().L.night))},2500)}
}
if(NATIVE)nat('scheduleChecks');
setInterval(()=>{
  if(sess||document.hidden||!S.pets.length||$('#modal').classList.contains('on')||$('#onb').classList.contains('on'))return;
  if(!stared&&Date.now()-stareStart>60e3){stared=true;say(T().stare);return}
  chatter();render();
},14000);
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
})();
</script>
</body>
</html>
